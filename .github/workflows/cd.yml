name: CD

# CI 가 develop · main push 에서 통과하면 arm64 이미지를 ECR 에 올린다. develop 은 dev 서버 컨테이너까지 바꾼다
# 서버의 compose · .env 는 STORIX-BE 배포가 만든다. 여기서는 ai 서비스 이미지만 바꾼다
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  push:
    name: 이미지 push
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04-arm
    outputs:
      env: ${{ steps.target.outputs.env }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 대상 환경
        id: target
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 빌드 · push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/storix-ai:${{ steps.target.outputs.env }}
            ${{ steps.ecr.outputs.registry }}/storix-ai:${{ steps.target.outputs.env }}-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  deploy-dev:
    name: dev 서버 교체
    needs: push
    if: needs.push.outputs.env == 'dev'
    runs-on: ubuntu-latest
    env:
      INSTANCE_ID: ${{ secrets.DEV_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # dev 서버는 밤에 꺼진다. 꺼져 있을 때 건너뛰면 켜져도 예전 이미지로 뜨니 이 실행을 다시 돌린다
      - name: 서버 확인
        id: ping
        run: |
          PING=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' --output text)
          if [ "$PING" = "Online" ]; then
            echo "online=true" >> "$GITHUB_OUTPUT"
          else
            echo "online=false" >> "$GITHUB_OUTPUT"
            echo "::warning::dev 서버가 꺼져 있어 교체를 건너뛴다. 켠 뒤 이 실행을 다시 돌린다"
          fi

      - name: 교체
        if: steps.ping.outputs.online == 'true'
        run: |
          cat > /tmp/params.json << 'JSON'
          {
            "commands": [
              "set -eu",
              "export HOME=/root",
              "cd /home/ubuntu/storix",
              "exec 9>.deploy.lock",
              "flock 9",
              "grep -q '^  ai:' docker-compose.yml || { echo 'compose 에 ai 서비스가 없다. STORIX-BE 배포가 먼저다'; exit 1; }",
              "REGISTRY=$(sed -n 's/^ECR_REGISTRY=//p' .env)",
              "aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin $REGISTRY",
              "docker compose --profile ai pull ai",
              "docker compose --profile ai up -d --no-deps ai",
              "for i in $(seq 1 30); do [ \"$(docker inspect -f '{{.State.Health.Status}}' storix-ai)\" = healthy ] && { echo 'storix-ai healthy'; exit 0; }; sleep 2; done",
              "docker logs --tail 50 storix-ai",
              "exit 1"
            ]
          }
          JSON

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/params.json \
            --query Command.CommandId --output text)

          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          [ "$STATUS" = "Success" ]
