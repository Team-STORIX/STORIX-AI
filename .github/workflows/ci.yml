name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: 의존성
        run: uv sync --frozen
      - name: pytest
        run: uv run pytest -q

  image:
    name: 이미지 빌드
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 빌드
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: storix-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 기동 확인
        run: |
          docker run -d --name ai -e STORIX_AI_INTERNAL_TOKEN=ci-token -p 8090:8090 storix-ai:ci
          for _ in $(seq 1 20); do curl -sf localhost:8090/health && exit 0; sleep 1; done
          docker logs ai
          exit 1
